name: Notion-triggered report

on:
  repository_dispatch:
    types: [notion-trigger]   # must match the event_type sent by the Worker

# Persist the generated diagrams (commit back) and deploy them to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Serialise runs so concurrent refreshes don't race on the push or the deploy.
concurrency:
  group: sankey-pages
  cancel-in-progress: false

jobs:
  run-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Installs exactly what's pinned in uv.lock; --locked fails the build
      # if the lock file is out of date rather than silently re-resolving it
      - name: Install dependencies
        run: uv sync --locked

      - name: Run script
        run: uv run sankey
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Which database to render, forwarded by the Worker (empty => default).
          NOTION_DATABASE_ID: ${{ github.event.client_payload.database_id }}

      - name: Place this database's diagram under site/<name>/
        run: |
          SLUG="$(cat db_slug.txt 2>/dev/null)"
          SLUG="${SLUG:-default}"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          mkdir -p "site/$SLUG"
          cp value_sankey.html "site/$SLUG/index.html"
          [ -f value_sankey.png ] && cp value_sankey.png "site/$SLUG/sankey.png" || true
          # Rebuild a simple landing page listing every diagram.
          {
            echo '<!doctype html><meta charset="utf-8"><title>Sankey diagrams</title>'
            echo '<h1>Sankey diagrams</h1><ul>'
            for d in site/*/; do
              n="$(basename "$d")"
              [ "$n" = "*" ] && continue
              echo "<li><a href=\"$n/\">$n</a></li>"
            done
            echo '</ul>'
          } > site/index.html

      - name: Commit diagrams (persist across runs)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "sankey: refresh ${SLUG:-default}" || echo "no changes to commit"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4