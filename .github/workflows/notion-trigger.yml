name: Notion-triggered report

on:
  repository_dispatch:
    types: [notion-trigger]   # must match the event_type sent by the Worker

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Installs exactly what's pinned in uv.lock; --locked fails the build
      # if the lock file is out of date rather than silently re-resolving it
      - name: Install dependencies
        run: uv sync --locked

      - name: Run script
        run: uv run sankey
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

          # <-- replace output.html with whatever filename your script writes
      - name: Prepare output folder
        run: |
           mkdir -p _site
           cp value_sankey.html _site/index.html

      # <-- replace YOUR-PAGES-PROJECT-NAME with the name you gave the
      # Pages project when you created it (see ACCESS_SETUP.md)
      # - name: Deploy to Cloudflare Pages
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: pages deploy _site --project-name=flex-sense-sankey
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
